<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fbf3ea" />
      <stop offset="100%" stop-color="#f3e6d4" />
    </radialGradient>
    <radialGradient id="originGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5954a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f5954a" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.3" fill="#1a0800" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)" />
  <rect width="1200" height="750" fill="url(#dots)" />
  <rect x="1" y="1" width="1198" height="748" fill="none" stroke="#e07b10" stroke-opacity="0.3" stroke-width="2" />

  <!-- mesh edges -->
  <g stroke="#e07b10" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="600" y1="360" x2="360" y2="220" />
    <line x1="600" y1="360" x2="800" y2="200" />
    <line x1="600" y1="360" x2="880" y2="420" />
    <line x1="600" y1="360" x2="720" y2="560" />
    <line x1="600" y1="360" x2="420" y2="540" />
    <line x1="600" y1="360" x2="260" y2="400" />
    <line x1="360" y1="220" x2="180" y2="160" />
    <line x1="360" y1="220" x2="260" y2="400" />
    <line x1="800" y1="200" x2="1000" y2="140" />
    <line x1="800" y1="200" x2="880" y2="420" />
    <line x1="880" y1="420" x2="1040" y2="480" />
    <line x1="880" y1="420" x2="720" y2="560" />
    <line x1="720" y1="560" x2="560" y2="660" />
    <line x1="420" y1="540" x2="260" y2="620" />
    <line x1="420" y1="540" x2="720" y2="560" />
    <line x1="260" y1="400" x2="120" y2="500" />
    <line x1="260" y1="400" x2="420" y2="540" />
    <line x1="180" y1="160" x2="80" y2="260" />
  </g>

  <!-- propagation pulses from origin node -->
  <g fill="none" stroke="#f5954a">
    <circle cx="600" cy="360" r="30" stroke-opacity="0.55">
      <animate attributeName="r" values="30;260" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="360" r="30" stroke-opacity="0.55">
      <animate attributeName="r" values="30;260" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.6s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="360" r="30" stroke-opacity="0.55">
      <animate attributeName="r" values="30;260" dur="3.6s" begin="2.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.6s" begin="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- origin node glow -->
  <circle cx="600" cy="360" r="90" fill="url(#originGlow)" />

  <!-- flagged / origin node (fake news source) -->
  <circle cx="600" cy="360" r="16" fill="#e0491f" />
  <circle cx="600" cy="360" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5" />

  <!-- affected nodes (closer to origin, lit up) -->
  <g fill="#f5954a" stroke="#ffffff" stroke-width="1.5">
    <circle cx="360" cy="220" r="9" />
    <circle cx="800" cy="200" r="9" />
    <circle cx="880" cy="420" r="9" />
    <circle cx="720" cy="560" r="9" />
    <circle cx="420" cy="540" r="9" />
    <circle cx="260" cy="400" r="9" />
  </g>

  <!-- unaffected / peripheral nodes -->
  <g fill="#8a7d6d" opacity="0.8">
    <circle cx="180" cy="160" r="6" />
    <circle cx="1000" cy="140" r="6" />
    <circle cx="1040" cy="480" r="6" />
    <circle cx="560" cy="660" r="6" />
    <circle cx="260" cy="620" r="6" />
    <circle cx="120" cy="500" r="6" />
    <circle cx="80" cy="260" r="6" />
  </g>

  <!-- corner label -->
  <text x="60" y="690" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#e07b10" letter-spacing="4" opacity="0.9">
    BLE MESH · GNN
  </text>
</svg>
